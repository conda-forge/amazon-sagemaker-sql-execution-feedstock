{% set name = "amazon-sagemaker-sql-execution" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: cdc15ab1c83a5b58b90fee0b1a49a233870f5ac3573d8fc88e1f44f1d765c85a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.8
    - setuptools >=61
    - wheel
    - pip
  run:
    - python >=3.8
    - boto3 >=1.28.64
    - aiobotocore >=2.7.0
    - pyathena >=3.3.0,<4
    - redshift_connector >=2.1.0,<3
    - aws-embedded-metrics >=3.2.0,<4
    - snowflake-connector-python >=3.8.1,<4.0
    - sagemaker-jupyterlab-extension-common >=0.2.1,<1
    - cryptography >=42.0.0

test:
  imports:
    - amazon_sagemaker_sql_execution
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://pypi.org/project/amazon-sagemaker-sql-execution/
  summary: 'Provides SQL Execution components for Amazon SageMaker'
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - earaghbidikashani
    - joshuatowner
    - aws-jasakshi
    - aakashmandavilli96
    - meghanajs99
    - kumarnzt
    - gogakoreli
    - varun196
    - HariniNarayanan
